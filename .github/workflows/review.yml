name: Review

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # run daily at 6am UTC

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Collect resolved forecasts
        run: ./review.rb
        env:
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resolved.jsonl || true
          if git diff --staged --quiet; then
            echo "No new resolved questions to commit."
          else
            git commit -m "data: add resolved forecast records [skip ci]"
            git push
          fi
